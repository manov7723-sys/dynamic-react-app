name: Build and push to ACR

# Manual trigger ONLY — this repo's "Run Pipeline" button (or workflow_dispatch
# from the CLI/API) is what starts a build. Pushing to master does NOT
# auto-run this workflow, by design: files can land on the default branch
# immediately while the actual build/deploy stays gated behind an explicit click.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ACR push secrets are present
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_DYNAMICREACTAPP_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_DYNAMICREACTAPP_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_DYNAMICREACTAPP_PASSWORD }}
        run: |
          missing=""
          [ -z "$ACR_LOGIN_SERVER" ] && missing="$missing ACR_DYNAMICREACTAPP_LOGIN_SERVER"
          [ -z "$ACR_USERNAME" ] && missing="$missing ACR_DYNAMICREACTAPP_USERNAME"
          [ -z "$ACR_PASSWORD" ] && missing="$missing ACR_DYNAMICREACTAPP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::DEEPAGENT_ACR_SECRETS_MISSING repo=${{ github.repository }} registry=dynamicreactapp missing=$missing"
            echo "One or more ACR admin secrets are missing/empty on this repo. The agent can heal this — say 'repair the ACR push auth' and it will refresh them."
            exit 1
          fi

      - name: Log in to ACR (admin credential from repo secrets)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_DYNAMICREACTAPP_LOGIN_SERVER }}
          username: ${{ secrets.ACR_DYNAMICREACTAPP_USERNAME }}
          password: ${{ secrets.ACR_DYNAMICREACTAPP_PASSWORD }}

      - name: Build and tag image
        env:
          IMAGE: dynamicreactapp.azurecr.io/dynamic-react-app
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .

      - name: Scan image for vulnerabilities (Trivy)
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "dynamicreactapp.azurecr.io/dynamic-react-app:${{ github.sha }}" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."

      - name: Push image
        env:
          IMAGE: dynamicreactapp.azurecr.io/dynamic-react-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
